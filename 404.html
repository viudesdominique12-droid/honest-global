<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0F1A">
<meta name="robots" content="noindex">
<title>Page not found · Honest Global PLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #0A0F1A;
        color: #F5F0E6;
        font: 400 16px/1.6 "Inter Tight", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    header {
        display: flex;
        align-items: center;
        height: 64px;
        padding: 0 clamp(20px, 4.5vw, 72px);
        border-bottom: 1px solid rgba(245, 240, 230, 0.14);
    }
    .name { font: 400 1.25rem/1 "Playfair Display", Georgia, serif; }
    .name span { margin-left: 0.6em; font: 500 0.625rem/1 "Inter Tight", sans-serif; letter-spacing: 0.16em; color: rgba(245, 240, 230, 0.54); vertical-align: 0.5em; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 64px clamp(20px, 4.5vw, 72px); }
    .num { font: italic 400 clamp(6rem, 18vw, 14rem)/0.8 "Playfair Display", Georgia, serif; color: #6B8CB5; }
    h1 { margin-top: 28px; max-width: 14ch; font: 400 clamp(2.5rem, 6vw, 5rem)/1.02 "Playfair Display", Georgia, serif; letter-spacing: -0.02em; }
    h1 em { font-style: italic; }
    .rule { height: 6px; margin: 32px 0 36px; border-top: 2px solid rgba(245, 240, 230, 0.4); border-bottom: 1px solid rgba(245, 240, 230, 0.4); }
    .home { display: inline-flex; gap: 0.6em; font: italic 400 1.375rem/1.2 "Playfair Display", Georgia, serif; padding-bottom: 5px; border-bottom: 1px solid rgba(245, 240, 230, 0.4); width: fit-content; }
    .home:hover { border-bottom-color: #F5F0E6; }
</style>
</head>
<body>
<header><a class="name" href="./" data-home>Honest Global<span>PLC</span></a></header>
<main>
    <span class="num" aria-hidden="true">404</span>
    <h1>This page <em>is not in the book.</em></h1>
    <div class="rule" aria-hidden="true"></div>
    <a class="home" href="./" data-home>Return to the cover <span aria-hidden="true">→</span></a>
</main>
<script>
    // On a GitHub Pages project site the site root is the first path segment.
    (function () {
        var root = '/';
        if (/\.github\.io$/.test(location.hostname)) {
            var first = location.pathname.split('/')[1];
            if (first) root = '/' + first + '/';
        }
        document.querySelectorAll('[data-home]').forEach(function (a) { a.setAttribute('href', root); });
    })();
</script>
</body>
</html>
