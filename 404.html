<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17325A">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/images/favicon.png" type="image/png" data-home-asset="assets/images/favicon.png">
<title>Page not found · Honest Global PLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=DM+Sans:wght@400;500&display=swap">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #17325A;
        color: #F5F0E6;
        font: 400 16px/1.6 "DM Sans", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    header {
        display: flex;
        align-items: center;
        height: 92px;
        padding: 0 clamp(20px, 4.5vw, 72px);
    }
    .name { display: inline-flex; align-items: center; font: 600 1.75rem/1 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; }
    .logo { display: block; margin-right: 16px; }
    .logo img { display: block; width: auto; height: 50px; }
    .logo .bar { display: block; height: 2px; margin-top: 4px; background: #DB6336; }
    .name > span:last-child { margin-left: 0.6em; font: 500 0.625rem/1 "DM Sans", sans-serif; letter-spacing: 0.16em; color: rgba(245, 240, 230, 0.54); vertical-align: 0.5em; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 64px clamp(20px, 4.5vw, 72px); }
    .num { font: 600 clamp(6rem, 18vw, 14rem)/0.8 "Barlow Condensed", "Arial Narrow", sans-serif; color: #E9C77B; }
    h1 { margin-top: 28px; max-width: 16ch; font: 600 clamp(2.5rem, 6vw, 5rem)/0.95 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; }
    h1 em { font-style: normal; color: #E9C77B; }
    .home { display: inline-flex; gap: 0.7em; margin-top: 40px; padding: 15px 24px; width: fit-content; font: 500 0.9375rem/1.2 "DM Sans", sans-serif; color: #0F2442; background: #F5F0E6; transition: background-color 0.3s; }
    .home:hover { background: #fff; }
</style>
</head>
<body>
<header><a class="name" href="./" data-home><span class="logo"><img src="assets/images/brand/cannon.webp" width="364" height="323" alt="" data-home-asset="assets/images/brand/cannon.webp"><span class="bar" aria-hidden="true"></span></span>Honest Global<span>PLC</span></a></header>
<main>
    <span class="num" aria-hidden="true">404</span>
    <h1>This page <em>is not in the book.</em></h1>
    <a class="home" href="./" data-home>Back to the home page <span aria-hidden="true">→</span></a>
</main>
<script>
    // On a GitHub Pages project site the site root is the first path segment.
    (function () {
        var root = '/';
        if (/\.github\.io$/.test(location.hostname)) {
            var first = location.pathname.split('/')[1];
            if (first) root = '/' + first + '/';
        }
        document.querySelectorAll('[data-home]').forEach(function (a) { a.setAttribute('href', root); });
        document.querySelectorAll('[data-home-asset]').forEach(function (el) {
            el.setAttribute(el.tagName === 'IMG' ? 'src' : 'href', root + el.getAttribute('data-home-asset'));
        });
    })();
</script>
</body>
</html>
